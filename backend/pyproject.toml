[project]
name = "alos"
version = "0.1.0"
description = "Automated Local OS frontier-grade agentic system."
requires-python = ">=3.9"
dependencies = [
    "langchain-core>=0.2.0",
    "langchain-openai>=0.1.0",
    "langgraph>=0.2.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "urllib3>=1.26.18,<2",
    "fastapi>=0.103.0",
    "uvicorn>=0.23.2",
    "websockets>=11.0.3",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "duckduckgo-search>=6.0.0",
    "pytest>=8.0.0",
    "psutil>=5.9.0",
    "numpy>=1.24.0",
]

[project.scripts]
alos = "src.api.server:main"

[tool.setuptools.packages.find]
where = ["src"]
# Module backends are discovered from modules/*/backend/src when installed
# as editable packages from their own pyproject.toml.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py39"
